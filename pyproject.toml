[project]
name = "relay-v2"
version = "0.1.0"
description = "Chain agent sessions for unattended multi-phase engineering work"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "John Mathews" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
]

[project.scripts]
relay = "relay_v2.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage[toml]>=7",
    "pytest-cov>=5",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=relay_v2 --cov-report=term-missing"
# Phase 3 (ADR-24): the REST/SSE suite uses httpx.AsyncClient against the
# ASGI app, so async test functions need a running loop. "auto" lets
# pytest-asyncio drive bare `async def test_*` without per-test markers;
# the existing Phase 1/2 suites use explicit `asyncio.run()` and are
# unaffected by this mode.
asyncio_mode = "auto"

[tool.coverage.run]
# The editable install resolves the package as ``relay_v2`` (.pth -> src/);
# instrument by module name, not the ``src`` path, or coverage reports 0%.
source = ["relay_v2"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
# scratch/ is committed pi de-risking evidence (CLAUDE.md: ground truth);
# it is not project source and must not be reformatted.
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["relay_v2"]
strict = true
