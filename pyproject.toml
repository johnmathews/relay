[project]
name = "relay"
version = "0.1.0"
description = "Chain agent sessions for unattended multi-phase engineering work"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "John Mathews" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    # MCP server (Phase 5). Bundled official SDK; `<2` cap is
    # load-bearing — v2 rearchitects the transport layer we mount. ADR-27.
    "mcp>=1.27.1,<2",
    # OTel mirror → Langfuse (Phase 7, opt-in via RELAY_OTEL_EXPORT).
    # `<2` is precautionary (OTel 2.0 does not exist yet) — recorded
    # honestly as such, not as load-bearing, in ADR-29. We deliberately
    # do NOT depend on opentelemetry-semantic-conventions (its GenAI
    # module is unstable); gen_ai.* keys are stable string literals.
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.scripts]
relay = "relay.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage[toml]>=7",
    "pytest-cov>=5",
    "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

# The canonical engineering-team skill lives at the repo root in
# `skills/` (spec.md §12), outside the `src/relay` package.
# force-include maps it into the wheel as `relay/skills/` so
# `harness.skills.bundled_skill_dir()` (ADR-44) can resolve a bundled
# copy when relay is installed from a wheel — relay then injects that
# path into pi via `pi --skill <path>` at spawn time. Editable/source
# installs resolve the repo-root tree directly via the same resolver.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "relay/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=relay --cov-report=term-missing"
# Phase 3 (ADR-24): the REST/SSE suite uses httpx.AsyncClient against the
# ASGI app, so async test functions need a running loop. "auto" lets
# pytest-asyncio drive bare `async def test_*` without per-test markers;
# the existing Phase 1/2 suites use explicit `asyncio.run()` and are
# unaffected by this mode.
asyncio_mode = "auto"

[tool.coverage.run]
# The editable install resolves the package as ``relay`` (.pth -> src/);
# instrument by module name, not the ``src`` path, or coverage reports 0%.
source = ["relay"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
# scratch/ is committed pi de-risking evidence (CLAUDE.md: ground truth);
# it is not project source and must not be reformatted.
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["relay"]
strict = true
